<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JUVENILES</title>
<script>try { var t = localStorage.getItem("cantera:theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef1ee;
  --panel: #ffffff;
  --ink: #1b2a41;
  --muted: #5b6b78;
  --line: #cfd8d2;
  --accent: #c8352f;
  --accent-ink: #ffffff;
  --hl: #ffe9a8;
  --inj: #d6232a;
  --call: #1a5fd0;
  --call-ink: #ffffff;
  --zebra: #f1f5f3;
  --notice-bg: #fff3d6;
  --notice-line: #d9b240;
  --error-bg: #fde8e6;
  --error-line: #c8352f;
  --head-bg: #e3e9e5;
  --focus: #1b6fd1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a22; --panel: #16232d; --ink: #e6edf1; --muted: #93a4b0; --line: #2a3b47;
    --accent: #ef6a62; --accent-ink: #1a0b0a; --hl: #5a4a12; --inj: #ff6b63; --call: #6aaeff; --call-ink: #0b1a2b;
    --zebra: #1b2b36; --notice-bg: #3a3118; --notice-line: #8a7326; --error-bg: #3b1d1b; --error-line: #ef6a62;
    --head-bg: #1d2e3a; --focus: #6aaeff;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a22; --panel: #16232d; --ink: #e6edf1; --muted: #93a4b0; --line: #2a3b47;
  --accent: #ef6a62; --accent-ink: #1a0b0a; --hl: #5a4a12; --inj: #ff6b63; --call: #6aaeff; --call-ink: #0b1a2b;
  --zebra: #1b2b36; --notice-bg: #3a3118; --notice-line: #8a7326; --error-bg: #3b1d1b; --error-line: #ef6a62;
  --head-bg: #1d2e3a; --focus: #6aaeff;
}

* { box-sizing: border-box; }
html { color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.45;
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

.wrap { max-width: 1680px; margin: 0 auto; padding: 0 16px; position: relative; }
header.top { padding: 10px 0 16px; }
.topbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding-top: 14px; }
.navwrap { position: relative; display: inline-block; }
.navwrap::after { content: "▾"; position: absolute; right: 13px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--ink); }
select.nav {
  appearance: none; -webkit-appearance: none; font: inherit; font-weight: 600; cursor: pointer; color: var(--ink);
  min-height: 42px; padding: 0 36px 0 14px; border: 1px solid var(--ink); border-radius: 4px; background: var(--panel);
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1 {
  margin: 0; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700;
  font-size: clamp(2.2rem, 9vw, 5.5rem); line-height: 0.9; letter-spacing: -0.01em;
}
.headrow { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 16px 24px; }
.headtext { flex: 1 1 360px; min-width: 0; }
.brand { display: flex; align-items: center; gap: clamp(10px, 2vw, 20px); }
.brand .logo { flex: none; width: clamp(64px, 11vw, 104px); height: auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,.25)); }
.brand h1 { min-width: 0; overflow-wrap: anywhere; }
.season { margin: 4px 0 0; font-weight: 700; color: var(--muted, inherit); letter-spacing: .04em; }
.summary { flex: 0 0 auto; min-width: 250px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; font-variant-numeric: tabular-nums; }
.summary dl { margin: 0; display: grid; grid-template-columns: auto auto; gap: 3px 22px; }
.summary dt { color: var(--muted); font-size: .875rem; }
.summary dd { margin: 0; text-align: right; font-weight: 600; white-space: nowrap; }
@media (max-width: 640px) { .summary { margin-right: 0; width: 100%; } }
.lede { margin: 10px 0 0; color: var(--muted); max-width: 70ch; }
.lede strong { color: var(--ink); font-weight: 600; }

.toolbar {
  display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: end;
  padding: 14px 0 12px; border-top: 2px solid var(--ink);
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; justify-content: flex-end; align-items: center; }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 0.875rem; color: var(--muted); }
.field input[type="search"], .field input[type="number"], .field input[type="password"] {
  font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 4px; padding: 7px 9px; min-height: 38px;
}
.field input[type="search"] { width: min(260px, 100%); }
.field input[type="number"] { width: 5rem; }
.range { display: flex; gap: 6px; align-items: center; }
.ages { display: flex; gap: 6px; flex-wrap: wrap; }
.ages button {
  font: inherit; min-width: 3rem; min-height: 40px; padding: 0 10px; cursor: pointer; border-radius: 4px;
  border: 1px solid var(--ink); background: var(--ink); color: var(--panel); font-weight: 600;
}
.ages button[aria-pressed="false"] { background: transparent; color: var(--muted); border-color: var(--line); }
button.btn {
  font: inherit; font-weight: 600; cursor: pointer; min-height: 38px; padding: 7px 14px;
  border-radius: 4px; border: 1px solid var(--ink); background: var(--panel); color: var(--ink);
}
button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.btn:hover { filter: brightness(0.96); }
button.btn[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }

#status { min-height: 1.4em; margin: 4px 0 10px; color: var(--muted); font-size: 0.95rem; }
.notice {
  border: 1px solid var(--notice-line); background: var(--notice-bg);
  border-left-width: 5px; border-radius: 4px; padding: 10px 14px; margin: 0 0 12px; max-width: 80ch;
}
.notice.error { border-color: var(--error-line); background: var(--error-bg); }
.notice p { margin: 0 0 6px; }
.notice p:last-child { margin: 0; }

.tablewrap { overflow: auto; max-height: 78vh; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; font-size: 1.03rem; line-height: 1.25; }
th, td { padding: 3px 6px; white-space: nowrap; text-align: center; border-bottom: 1px solid var(--line); }
th {
  white-space: normal;
  position: sticky; top: 0; z-index: 2; background: var(--head-bg); font-weight: 600;
  font-size: 0.85rem; padding: 0; border-bottom: 2px solid var(--ink);
}
th button {
  all: unset; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
  gap: 4px; width: 100%; padding: 6px 5px; cursor: pointer;
  white-space: normal; line-height: 1.15; text-wrap: balance; text-align: center; min-height: calc(2.3em + 12px);   /* encabezados de hasta dos líneas, todos con la misma altura */
}
th button:hover { background: rgba(0,0,0,.06); }
th button:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
th.c-name button { justify-content: center; }
th[aria-sort="ascending"] button::after { content: "▲"; font-size: .65em; color: var(--accent); }
th[aria-sort="descending"] button::after { content: "▼"; font-size: .65em; color: var(--accent); }
td.c-name { text-align: left; }
.chg { font-size: .7em; vertical-align: 1px; }
.chg.up { color: #1f8f4a; }
.chg.down { color: #c8352f; }
:root[data-theme="dark"] .chg.up { color: #5fd58b; }
:root[data-theme="dark"] .chg.down { color: #ff8a82; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chg.up { color: #5fd58b; } :root:not([data-theme="light"]) .chg.down { color: #ff8a82; } }
.mk { font-weight: 700; font-size: .7em; margin-left: 1px; vertical-align: super; line-height: 0; }
.mk.ok { color: #1f8f4e; }
.mk.bad { color: #c0392b; }
.tipo { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; font-size: .68rem; font-weight: 700; letter-spacing: .03em; vertical-align: .22em; line-height: 1.25; background: var(--line); color: var(--ink); border: 1px solid var(--muted); white-space: nowrap; }
.tipo.gk { background: #fbefc2; border-color: #c9a227; color: #5c4700; }
:root[data-theme="dark"] .tipo.gk { background: #4a3f12; border-color: #c9a227; color: #f6e29b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tipo.gk { background: #4a3f12; border-color: #c9a227; color: #f6e29b; } }
.stars { color: #e0a800; font-weight: 700; letter-spacing: 1px; white-space: nowrap; vertical-align: .18em; line-height: 1.1; }
.mk.star { color: #e0a800; font-size: 1em; vertical-align: .22em; }
.mk.warn { color: #d11a1a; font-size: .95em; vertical-align: .22em; }
:root[data-theme="dark"] .mk.warn { color: #ff6b6b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mk.warn { color: #ff6b6b; } }
:root[data-theme="dark"] .mk.ok { color: #5fd08a; }
:root[data-theme="dark"] .mk.bad { color: #ff7b6e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mk.ok { color: #5fd08a; } :root:not([data-theme="light"]) .mk.bad { color: #ff7b6e; } }
.ao { display: inline-block; min-width: 2em; padding: 0 7px; line-height: 1.35; border-radius: 999px; font-weight: 700; font-variant-numeric: tabular-nums;
  background: hsl(var(--h) 65% 86%); color: hsl(var(--h) 65% 20%); border: 1px solid hsl(var(--h) 45% 62%); }
:root[data-theme="dark"] .ao { background: hsl(var(--h) 40% 25%); color: hsl(var(--h) 75% 86%); border-color: hsl(var(--h) 40% 45%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ao { background: hsl(var(--h) 40% 25%); color: hsl(var(--h) 75% 86%); border-color: hsl(var(--h) 40% 45%); } }
td.c-reg.hi { background: #d6f0dd; color: #14532d; font-weight: 700; }
:root[data-theme="dark"] td.c-reg.hi { background: #1f4130; color: #b8f0cc; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) td.c-reg.hi { background: #1f4130; color: #b8f0cc; } }
td.c-reg { white-space: nowrap; font-variant-numeric: tabular-nums; }
th.c-prog, td.c-prog { min-width: 14rem; text-align: left; }
td.c-prog input { width: 100%; min-width: 12rem; box-sizing: border-box; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; min-height: 26px; }
td.c-prog input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
tbody tr:nth-child(even) td { background-color: var(--zebra); }
tbody tr:hover td { background-color: color-mix(in srgb, var(--accent) 7%, var(--panel)); }

th.c-chk, td.c-chk { width: 4.6rem; min-width: 4.6rem; padding-left: 4px; padding-right: 4px; text-align: center; }
select.chk { width: 4.1rem; height: 24px; padding: 0 2px; font: inherit; font-weight: 700; font-size: .9rem; text-align: center; text-align-last: center; cursor: pointer; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
select.chk[data-v="2"] { color: #d11a1a; border-color: #d11a1a; font-size: 1.05rem; }
select.chk[data-v="GK"] { background: #fbefc2; border-color: #c9a227; }
select.chk[data-v="DEF"] { background: #bfe3c4; border-color: #2f7d3b; }
select.chk[data-v="MID"] { background: #e3b0bf; border-color: #7b1e3a; }
select.chk[data-v="ATT"] { background: #b5c3e6; border-color: #1b2a63; }
:root[data-theme="dark"] select.chk[data-v="2"] { color: #ff6b6b; border-color: #ff6b6b; }
:root[data-theme="dark"] select.chk[data-v="GK"] { background: #4a3f12; border-color: #c9a227; }
:root[data-theme="dark"] select.chk[data-v="DEF"] { background: #1b4a28; border-color: #4fa862; }
:root[data-theme="dark"] select.chk[data-v="MID"] { background: #4a1626; border-color: #b03a5a; }
:root[data-theme="dark"] select.chk[data-v="ATT"] { background: #172447; border-color: #4a63b5; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) select.chk[data-v="2"] { color: #ff6b6b; border-color: #ff6b6b; }
  :root:not([data-theme="light"]) select.chk[data-v="GK"] { background: #4a3f12; border-color: #c9a227; }
  :root:not([data-theme="light"]) select.chk[data-v="DEF"] { background: #1b4a28; border-color: #4fa862; }
  :root:not([data-theme="light"]) select.chk[data-v="MID"] { background: #4a1626; border-color: #b03a5a; }
  :root:not([data-theme="light"]) select.chk[data-v="ATT"] { background: #172447; border-color: #4a63b5; }
}
th.c-n, td.c-n { width: 3.2rem; min-width: 3.2rem; color: var(--muted); }
th.c-est, td.c-est { width: 5.6rem; min-width: 5.6rem; padding-left: 4px; padding-right: 4px; }
td.frz { position: sticky; z-index: 1; background-color: var(--panel); }
th.frz { z-index: 3; background: var(--head-bg); }
.frz-last { box-shadow: 3px 0 4px -2px rgba(0,0,0,.25); }

td.c-name a { color: var(--ink); font-weight: 600; text-decoration-color: var(--line); text-underline-offset: 3px; }
td.c-name a:hover { text-decoration-color: var(--accent); }
select.est {
  font: inherit; font-size: .85rem; width: 100%; min-height: 30px; padding: 2px 2px; border-radius: 4px; cursor: pointer;
  color: var(--ink); background: var(--bg); border: 1px solid var(--line);
}
select.est[data-v="GK"] { background: #fbefc2; border-color: #c9a227; font-weight: 700; }
select.est[data-v="DEF"] { background: #bfe3c4; border-color: #2f7d3b; font-weight: 700; }
select.est[data-v="MID"] { background: #e3b0bf; border-color: #7b1e3a; font-weight: 700; }
select.est[data-v="ATT"] { background: #b5c3e6; border-color: #1b2a63; font-weight: 700; }
select.est[data-v="ENT"] { background: #e6dcf5; border-color: #8a6cc0; font-weight: 700; }
select.est[data-v="EXT"] { background: #d3eef0; border-color: #4aa3ad; font-weight: 700; }
:root[data-theme="dark"] select.est[data-v="GK"] { background: #4a3f12; border-color: #c9a227; }
:root[data-theme="dark"] select.est[data-v="DEF"] { background: #1b4a28; border-color: #4fa862; }
:root[data-theme="dark"] select.est[data-v="MID"] { background: #4a1626; border-color: #b03a5a; }
:root[data-theme="dark"] select.est[data-v="ATT"] { background: #172447; border-color: #4a63b5; }
:root[data-theme="dark"] select.est[data-v="ENT"] { background: #33224f; border-color: #8a6cc0; }
:root[data-theme="dark"] select.est[data-v="EXT"] { background: #17383d; border-color: #4aa3ad; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) select.est[data-v="GK"] { background: #4a3f12; border-color: #c9a227; }
  :root:not([data-theme="light"]) select.est[data-v="DEF"] { background: #1b4a28; border-color: #4fa862; }
  :root:not([data-theme="light"]) select.est[data-v="MID"] { background: #4a1626; border-color: #b03a5a; }
  :root:not([data-theme="light"]) select.est[data-v="ATT"] { background: #172447; border-color: #4a63b5; }
  :root:not([data-theme="light"]) select.est[data-v="ENT"] { background: #33224f; border-color: #8a6cc0; }
  :root:not([data-theme="light"]) select.est[data-v="EXT"] { background: #17383d; border-color: #4aa3ad; }
}
td.c-name .sel { margin-left: 8px; padding: 1px 5px; border-radius: 3px; font-size: .62rem; font-weight: 700; background: var(--call); color: var(--call-ink); letter-spacing: .03em; }
td.c-name .inj { margin-left: 8px; display: inline-flex; align-items: center; gap: 3px; font-size: .68rem; font-weight: 700; color: var(--inj); white-space: nowrap; vertical-align: middle; }
td.c-name .inj svg { width: 13px; height: 13px; fill: var(--inj); }
td.c-name .redcard { display: inline-block; margin-left: 8px; width: 11px; height: 15px; border-radius: 2px; background: #d6232a; border: 1px solid rgba(0,0,0,.35); vertical-align: middle; transform: rotate(8deg); }
td.c-name .copypid {
  all: unset; box-sizing: border-box; margin-left: 8px; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center;
  vertical-align: middle; cursor: pointer; color: var(--muted); border: 1px solid var(--line); border-radius: 4px;
}
td.c-name .copypid:hover { color: var(--ink); border-color: var(--ink); }
td.c-name .copypid svg { width: 14px; height: 14px; }
#toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 50;
  background: var(--ink); color: var(--panel); padding: 10px 18px; border-radius: 6px; font-weight: 600;
  box-shadow: 0 4px 16px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .2s;
}
#toast.show { opacity: 1; }

td.pos { min-width: 3rem; }
td.sk { min-width: 2.4rem; }
td.sk, td.pos { padding-left: 4px; padding-right: 4px; }
table.no-val .c-val { display: none; }
th.sepl, td.sepl { border-left: 1px solid var(--muted); }
th.sepr, td.sepr { border-right: 1px solid var(--muted); }
.chg { font-size: .7em; vertical-align: 1px; }
.chg.up { color: #1f8f4a; }
.chg.down { color: #c8352f; }
:root[data-theme="dark"] .chg.up { color: #5fd58b; }
:root[data-theme="dark"] .chg.down { color: #ff8a82; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chg.up { color: #5fd58b; } :root:not([data-theme="light"]) .chg.down { color: #ff8a82; } }
th.hl { background: var(--hl); }
tbody tr td.hl { background-color: var(--hl); font-weight: 600; }
.dim { color: var(--muted); }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); }
.theme {
  flex: none; width: 42px; height: 42px; padding: 0;
  display: grid; place-items: center; border-radius: 50%; cursor: pointer;
  border: 1px solid var(--ink); background: var(--panel); color: var(--ink);
}
.theme svg { width: 22px; height: 22px; }

details.formulas { margin: 22px 0 40px; max-width: 900px; }
details.formulas summary { cursor: pointer; font-weight: 600; padding: 6px 0; }
details.formulas table { margin-top: 10px; background: var(--panel); border: 1px solid var(--line); }
details.formulas td, details.formulas th { text-align: left; position: static; padding: 7px 10px; white-space: normal; }
details.formulas p { max-width: 70ch; color: var(--muted); }

dialog.dlg {
  width: min(420px, calc(100vw - 32px)); padding: 22px; border: 2px solid var(--ink); border-radius: 6px;
  background: var(--panel); color: var(--ink);
}
dialog.dlg::backdrop { background: rgba(10, 20, 30, .55); }
dialog.dlg h2 { margin: 0 0 6px; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: 2rem; line-height: 1; font-weight: 700; }
dialog.dlg .hint { margin: 0 0 14px; color: var(--muted); font-size: .92rem; }
dialog.dlg .field { margin-bottom: 12px; }
dialog.dlg .field input { width: 100%; background: var(--bg); min-height: 40px; }
dialog.dlg .msg { min-height: 1.3em; margin: 0 0 10px; color: var(--accent); font-weight: 600; font-size: .92rem; }
dialog.dlg .actions { display: flex; justify-content: flex-end; gap: 10px; }

@media (max-width: 640px) { th.c-n, td.c-n { width: 2.6rem; min-width: 2.6rem; padding-left: 6px; padding-right: 6px; } }
.ready { color: var(--call); font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <label class="navwrap"><span class="sr">Cambiar de sección</span>
      <select class="nav" id="nav">
        <option value="./">Plantel</option>
        <option value="juveniles.html" selected>Juveniles</option>
        <option value="alineaciones.html">Alineaciones</option>
      </select>
    </label>
    <button class="theme" id="theme" type="button" aria-label="Cambiar a modo oscuro" title="Cambiar a modo oscuro"></button>
  </div>
  <header class="top">
    <div class="headrow">
      <div class="headtext">

// Si Semanas Entrenadas supera al Recuento de Entrenos en exactamente CONFIG.autoAppendDiff, se añade el Nivel actual al final de Progreso.
// Tras añadirlo, el Recuento sube y la condición deja de cumplirse, así que cada juvenil se actualiza una sola vez por semana de entreno.
function autoAppend() {
  if (CONFIG.estUrl && (!sync.key || (sync.state !== "ok"))) return;   // con sincronización, solo sobre datos ya al día
  let n = 0; const done = [];
  for (const p of state.players) {
    if (p.id == null || !Number.isFinite(p.weeksIn) || !Number.isFinite(p.skill)) continue;
    const k = progKey(p.id), cur = progOf(p);
    const items = cur.split(",").filter(x => x.trim() !== "").length;
    if (items < 1 || p.weeksIn - (items - 1) !== CONFIG.autoAppendDiff) continue;
    const next = cur.replace(/[,\s]+$/, "") + "," + p.skill;
    if (next.length > 200) continue;
    progMap[k] = { v: next, t: nextT(k) }; sync.dirty.add(k); n++; done.push(`${p.name} (${p.skill})`);
  }
  if (!n) return;
  saveProg(); refreshProgInputs(); pushDirty();
  toast(`Se añadió el Nivel al Progreso de ${n} juvenil${n === 1 ? "" : "es"}.`, 6000);
  // Aviso que queda visible hasta recargar la página.
  const box = document.createElement("div");
  box.className = "notice";
  box.innerHTML = `<p><strong>autoAppendDiff se ejecutó:</strong> se añadió el Nivel al final del Progreso de ${n} juvenil${n === 1 ? "" : "es"}: ${esc(done.join(", "))}.</p>`;
  $("#notices").appendChild(box);
}

const num = v => {
  if (typeof v === "number" && Number.isFinite(v)) return v;
  if (typeof v === "string" && v.trim() !== "" && Number.isFinite(Number(v))) return Number(v);
  if (v && typeof v === "object") {
    for (const k of ["value", "level", "current", "now", "skill", "points"]) {

function pickSkills(apiSkills) {
  const lower = {};
  for (const [k, v] of Object.entries(apiSkills || {})) lower[k.toLowerCase()] = v;
  const sk = {};
  for (const key of SKILL_KEYS) {
    let v = null;
    for (const a of SKILL_ALIASES[key]) { if (a in lower) { v = num(lower[a]); if (v !== null) break; } }
    sk[key] = v;
  }

}
// Busca el objeto que contiene los niveles de skills: normalmente "skills", pero si están en otro lugar se elige el que más nombres reconocidos tenga.
function findSkillsSource(info) {
  const known = new Set(Object.values(SKILL_ALIASES).flat());
  const score = o => (o && typeof o === "object" && !Array.isArray(o))
    ? Object.keys(o).filter(k => known.has(k.toLowerCase())).length : 0;
  let best = info.skills || {}, bestScore = score(best);
  const queue = [info];
  for (let guard = 0; queue.length && guard < 300; guard++) {
    const o = queue.shift();
    for (const v of Object.values(o)) {
      if (v && typeof v === "object" && !Array.isArray(v)) {
        const sc = score(v);
        if (sc > bestScore) { best = v; bestScore = sc; }
        queue.push(v);
      }
    }
  }
  return bestScore >= 3 ? best : (info.skills || {});
}
// Primer valor simple cuya clave coincide con el patrón (hasta 4 niveles de profundidad).
function deepFind(o, re, depth = 0) {
  if (!o || typeof o !== "object" || Array.isArray(o) || depth > 3) return null;
  for (const [k, v] of Object.entries(o)) if (re.test(k) && v !== null && typeof v !== "object") return v;
  for (const v of Object.values(o)) {
    if (v && typeof v === "object" && !Array.isArray(v)) { const r = deepFind(v, re, depth + 1); if (r !== null) return r; }
  }
  return null;
}
function keyPaths(o, prefix = "", depth = 0, out = []) {
  for (const [k, v] of Object.entries(o || {})) {
    if (v && typeof v === "object" && !Array.isArray(v) && depth < 2) keyPaths(v, prefix + k + ".", depth + 1, out);
    else out.push(prefix + k);
  }

}
function juniorName(o) {
  const n = o.name;
  if (typeof n === "string" && n) return n;
  if (n && typeof n === "object") {
    if (n.full) return String(n.full);
    const parts = [n.first ?? n.firstName ?? n.name, n.last ?? n.lastName ?? n.surname].filter(Boolean);
    if (parts.length) return parts.join(" ");
  }
  const f = deepFind(o, /^(fullName|full)$/i);
  if (f) return String(f);
  return [deepFind(o, /^(firstName|name)$/i), deepFind(o, /^(lastName|surname)$/i)].filter(Boolean).join(" ");
}

function normalize(it, i) {

    age: num(deepFind(src, /^age$/i)), weeks: num(deepFind(src, /^weeksLeft$/i)),

    skill: num(src.skill ?? deepFind(src, /^skill$/i)),

    formation: (v => v == null || typeof v === "object" ? null : v)(src.formation ?? deepFind(src, /^formation$/i)),

/* Datos cifrados (la contraseña se comparte con la página del plantel: queda guardada una sola vez en este navegador) */
const PW_KEY = "equipo:pw";
const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function fetchEnvelope(url) {
  try {
    const r = await fetchWithTimeout(url, { cache: "no-store" });
    if (!r.ok) return null;
    const j = await r.json();
    return j && j.data && j.salt && j.iv ? j : null;
  } catch { return null; }
}
async function decryptEnvelope(env, pw) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(String(pw).normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(env.salt), iterations: env.iter, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  let buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(env.iv) }, key, b64(env.data));
  if (env.z) buf = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
  return JSON.parse(new TextDecoder().decode(buf));
}
const savedPw = () => { try { return localStorage.getItem(PW_KEY) || ""; } catch { return ""; } };
const savePw = pw => { try { localStorage.setItem(PW_KEY, pw); } catch {} };
const forgetPw = () => { try { localStorage.removeItem(PW_KEY); } catch {} };
function askPassword(msg) {
  const dlg = $("#pwDlg");

}
async function unlock(env) {
  let pw = savedPw(), msg = "";
  for (;;) {
    if (!pw) { setStatus("Datos protegidos con contraseña."); pw = await askPassword(msg); }
    try {
      const data = await decryptEnvelope(env, pw);
      savePw(pw);
      if ($("#pwDlg").open) $("#pwDlg").close();
      return { data, pw };
    } catch {
      forgetPw(); pw = ""; msg = "Contraseña incorrecta. Inténtalo de nuevo.";
    }
  }
}

    }

        : `<p><strong>Faltan los datos de la escuela.</strong> Vuelve a ejecutar <code>node fetch-team.mjs</code> con la versión nueva y sube <code>juniors.enc.json</code>.</p>` });

const FREEZE_KEYS = ["n", "chk", "name", "age", "skill"];   // columnas inmovilizadas al hacer scroll horizontal: hasta Nivel
function applyFreeze() {
  const wrap = document.querySelector(".tablewrap");
  document.querySelectorAll(".frz").forEach(el => { el.classList.remove("frz", "frz-last"); el.style.left = ""; });
  if (!wrap || document.querySelector("#body td.empty")) return;
  const ths = FREEZE_KEYS.map(k => document.querySelector(`#head th[data-key="${k}"]`)).filter(th => th && th.offsetWidth > 0);
  const limit = (wrap.clientWidth || window.innerWidth) * 0.8;   // en pantallas angostas se inmovilizan menos columnas
  let left = 0;
  const chosen = [];
  ths.forEach((th, i) => {
    const w = th.getBoundingClientRect().width;
    if (i < 3 || left + w <= limit) { chosen.push([th, left]); left += w; }
  });
  chosen.forEach(([th, l], idx) => {
    const last = idx === chosen.length - 1;
    const col = COLS.findIndex(c => c.key === th.dataset.key);
    const cells = [th, ...document.querySelectorAll(`#body tr td:nth-child(${col + 1})`)];
    for (const el of cells) { el.classList.add("frz"); if (last) el.classList.add("frz-last"); el.style.left = l + "px"; }
  });
}
window.addEventListener("resize", () => applyFreeze());
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => applyFreeze());

const PREFS_KEY = "juveniles:prefs";
let prefsReady = false;
function savePrefs() {
  if (!prefsReady) return;
  try { localStorage.setItem(PREFS_KEY, JSON.stringify({ sort: state.sort, simple: state.simple })); } catch {}
}
function loadPrefs() {
  let p = null;
  prefsReady = true;
  try { p = JSON.parse(localStorage.getItem(PREFS_KEY)); } catch {}
  if (!p || typeof p !== "object") return;
  if (p.simple === true) setSimple(true);
  if (p.sort && COLS.some(c => c.key === p.sort.key) && (p.sort.dir === 1 || p.sort.dir === -1)) state.sort = { key: p.sort.key, dir: p.sort.dir };
}

/* ─────────────── Cuadro resumen de la escuela ───────────────
   Plazas (size), Juveniles, Talentosos (★★★), Nivel Escuela (averageSkill), Entrenador, Salario DT y Costo Escuela (value + salario del DT).
   Los datos de la escuela los junta el script con nombres de campo flexibles; si falta alguno, la fila muestra «—». */
const snf = new Intl.NumberFormat("es-CL"), snf1 = new Intl.NumberFormat("es-CL", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
function schoolInfo(sc) {
  const out = { size: null, avg: null, value: null, coach: null, salary: null, cur: "", paths: {} };
  const fields = (sc && sc.fields) || [];
  const last = f => f.path.split(".").pop().replace(/\[\d+\]$/, "");
  const isCoach = f => /coach|trainer/i.test(f.path) || /coach|trainer/i.test(f.src);
  const numOf = f => { const n = Number(f.value); return f.value !== "" && f.value !== null && typeof f.value !== "boolean" && Number.isFinite(n) ? n : null; };
  const pick = (re, notCoach) => fields.find(f => re.test(last(f)) && numOf(f) !== null && !(notCoach && isCoach(f)));
  const fs = pick(/^size$/i, true), fa = pick(/^averageSkill$/i, true), fv = pick(/^weeklyCost$/i, true) || pick(/^value$/i, true);
  if (fs) { out.size = numOf(fs); out.paths.size = `${fs.src}.${fs.path}`; }
  if (fa) { out.avg = numOf(fa); out.paths.avg = `${fa.src}.${fa.path}`; }
  if (fv) { out.value = numOf(fv); out.paths.value = `${fv.src}.${fv.path}`; out.cur = fv.currency || ""; }
  // Entrenador: se busca dentro de «trainers» (lista) o de cualquier objeto coach/trainer. Si hay varios entrenadores, se elige el que parezca asignado
  // a la escuela (un campo tipo assigned/junior/school/academy/active/current verdadero); si no, el primero.
  const cf = fields.filter(isCoach);
  const prefixOf = f => { const m = f.path.match(/^(.*?\[\d+\])/); return f.src + "|" + (m ? m[1] : ""); };
  const groups = new Map();
  for (const f of cf) { const k = prefixOf(f); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(f); }
  const truthy = f => f.value === true || f.value === 1 || f.value === "1" || (typeof f.value === "string" && /junior|school|academy|assigned|yes|true/i.test(f.value));
  const assigned = g => g.some(f => (/(assign|junior|school|academy|active|current|hired)/i.test(last(f)) && truthy(f)) || (typeof f.value === "string" && /junior|academy/i.test(f.value)));
  const list = [...groups.values()];
  const g = list.find(assigned) || list[0];
  out.coachCount = list.length;
  if (g) {
    const str = f => typeof f.value === "string" && f.value.trim() ? f.value.trim() : null;
    const full = g.find(f => /(^|\.)(fullName|name\.full|full)$/i.test(f.path) && str(f)) || g.find(f => /(^|\.)name$/i.test(f.path) && str(f));
    if (full) { out.coach = str(full); out.paths.coach = `${full.src}.${full.path}`; }
    else {
      const fn = g.find(f => /(^|\.)(name\.first|name\.firstName|firstName|first)$/i.test(f.path) && str(f));
      if (fn) {
        const pre = fn.path.replace(/(name\.)?(firstName|first)$/i, "");
        const ln = g.find(f => f.path.startsWith(pre) && /(name\.last|name\.lastName|lastName|surname|last)$/i.test(f.path) && str(f));
        out.coach = [str(fn), ln && str(ln)].filter(Boolean).join(" "); out.paths.coach = `${fn.src}.${fn.path}`;
      }
    }
    const fsal = g.find(f => /^(salary|wage|weeklySalary|weeklyWage|weeklyCost|cost|price|pay|payment)$/i.test(last(f)) && numOf(f) !== null);
    if (fsal) { out.salary = numOf(fsal); out.paths.salary = `${fsal.src}.${fsal.path}`; out.salCur = fsal.currency || ""; }
  }
  out.cur = out.cur || out.salCur || (sc && sc.currency) || "";
  return out;
}
function renderSummary() {
  const el = $("#summary"), ps = state.players;
  if (!ps.length && !state.school) { el.hidden = true; return; }
  el.hidden = false;
  const si = schoolInfo(state.school);
  const money = n => n == null ? "—" : snf.format(n) + (si.cur ? " " + si.cur : "");
  const cost = si.value != null ? si.value + (si.salary ?? 0) : null;
  const tip = k => si.paths[k] ? "Campo usado: " + si.paths[k] : (state.school ? "No se encontró este dato en la API." : "Vuelve a ejecutar node fetch-team.mjs para obtener los datos de la escuela.");
  const rows = [
    ["Plazas", si.size == null ? "—" : snf.format(si.size), tip("size")],
    ["Juveniles", String(ps.length)],
    ["Talentosos", String(ps.filter(tripleStar).length)],
    ["Nivel Escuela", si.avg == null ? "—" : snf1.format(si.avg), tip("avg")],
    ["Entrenador", si.coach || "—", si.coach ? `${tip("coach")}${si.coachCount > 1 ? ` (${si.coachCount} entrenadores en la API: se eligió el asignado a la escuela o, si no se distingue, el primero)` : ""}` : tip("coach")],
    ["Salario DT", money(si.salary), tip("salary")],
    ["Costo Escuela", cost == null ? "—" : money(cost), si.value == null ? tip("value") : `${si.paths.value} + salario del DT${si.salary == null ? " (no encontrado: solo el costo)" : ""}`]
  ];
  el.innerHTML = `<dl>${rows.map(([k, v, t]) => `<dt>${k}</dt><dd${t ? ` title="${esc(t)}"` : ""}>${esc(v)}</dd>`).join("")}</dl>`;
}

/* ─────────────── Simplificar y Calculadora ─────────────── */
const SIMPLE_HIDE = ["talent", "prog", "reg", "progN"];
// En la calculadora solo quedan visibles las últimas cinco columnas (desde Progreso); Simplificar no aplica ahí.
const CALC_SHOW = COLS.slice(COLS.findIndex(c => c.key === "prog")).map(c => c.key);
const hiddenKeys = () => state.calc ? COLS.map(c => c.key).filter(k => !CALC_SHOW.includes(k)) : state.simple ? SIMPLE_HIDE : [];
const visibleCols = () => COLS.filter(c => !hiddenKeys().includes(c.key));
function applyColVis() {
  const hid = hiddenKeys();
  COLS.forEach((c, i) => {
    const off = hid.includes(c.key);
    const th = document.querySelector(`#head th:nth-child(${i + 1})`);
    if (th) { th.style.display = off ? "none" : ""; if (SEP[c.key]) th.classList.add(SEP[c.key]); }
    document.querySelectorAll(`#body td:nth-child(${i + 1})`).forEach(td => { if (!td.classList.contains("empty")) { td.style.display = off ? "none" : ""; if (SEP[c.key]) td.classList.add(SEP[c.key]); } });
  });
}
const CALC_NUM = ["age", "skill", "weeks", "weeksIn", "talent"];
const CALC_EDIT = ["name", "age", "skill", "weeks", "weeksIn", "talent", "prog"];
const newCalcP = () => ({ calc: true, id: null, n: 1, name: "", age: null, skill: null, weeks: null, weeksIn: null, talent: null, formation: "", progText: "" });
function calcRowHtml() {
  const p = state.calcP;
  const tds = COLS.map((c, i) => {
    if (!CALC_EDIT.includes(c.key)) return cellHtml(c, p, 0);
    const num = CALC_NUM.includes(c.key);
    const key = c.key === "prog" ? "progText" : c.key;
    const v = p[key] ?? "";
    return `<td class="${c.key === "prog" ? "c-prog" : c.key === "name" ? "l c-name" : ""}"><input type="${num ? "number" : "text"}" ${num ? 'step="any" inputmode="decimal"' : ""} data-calc="${key}" value="${esc(String(v))}" aria-label="${esc(c.label)}"${c.key === "prog" ? ' maxlength="200"' : ""}${num ? ' style="width:5.5rem"' : ""}></td>`;
  }).join("");
  return `<tr class="calc-row">${tds}</tr>`;
}
// Recalcula las celdas derivadas de la fila de la calculadora sin recrear los campos (para no perder el foco).
function calcRefresh() {
  const tr = $("#body tr.calc-row"); if (!tr) return;
  COLS.forEach((c, i) => {
    if (CALC_EDIT.includes(c.key)) return;
    const tpl = document.createElement("template");
    tpl.innerHTML = cellHtml(c, state.calcP, 0);
    if (tr.children[i] && tpl.content.firstChild) tr.replaceChild(tpl.content.firstChild, tr.children[i]);
  });
  applyColVis();
}
function setCalc(on) {
  state.calc = on;
  state.calcP = on ? newCalcP() : null;   // siempre empieza vacía; nunca se guarda ni se sincroniza
  const b = $("#calcBtn"); b.setAttribute("aria-pressed", String(on)); b.textContent = on ? "Salir de la calculadora" : "Calculadora";
  document.querySelectorAll(".toolbar .field").forEach(el => { el.hidden = on; });
  $("#copy").disabled = on;
  $("#simplify").disabled = on;
  $("#stars").disabled = on;
}
function setSimple(on) {
  state.simple = on;
  const b = $("#simplify"); b.setAttribute("aria-pressed", String(on)); b.textContent = on ? "Mostrar todo" : "Simplificar";
}

function cellHtml(c, p, rowIdx) {
    if (c.key === "n") return `<td class="c-n">${rowIdx + 1}</td>`;
    if (c.key === "chk") {
    if (p.calc || p.id == null || !/^\d+$/.test(String(p.id))) return `<td class="c-chk"></td>`;
    const v = chkVal(p);
    return `<td class="c-chk"><select class="chk" data-chk="${esc(String(p.id))}" data-v="${v}" aria-label="Marca de ${esc(p.name)}"><option value=""${v === "" ? " selected" : ""}></option>${CHK_OPTS.map(o => `<option value="${o}"${v === o ? " selected" : ""}>${CHK_LABEL[o] || o}</option>`).join("")}</select></td>`;
  }
  if (c.key === "name") return `<td class="l c-name" ${p.calc ? "" : `data-nm="${esc(String(p.id ?? ""))}"`}>${nameHtml(p)}</td>`;
    if (REG_KEYS.includes(c.key)) { const rc = regCol(c.key, progOf(p)), t = rc.t; return `<td class="c-reg${t ? "" : " dim"}${rc.hi ? " hi" : ""}" ${p.calc ? "" : `data-reg="${esc(String(p.id ?? ""))}"`} data-f="${c.key}">${t ? esc(t) : "—"}</td>`; }
    if (c.key === "progN") return `<td class="c-progn" ${p.calc ? "" : `data-cnt="${esc(String(p.id ?? ""))}"`} data-wi="${p.weeksIn ?? ""}">${cntHtml(countItems(progOf(p)), p.weeksIn)}</td>`;
    if (c.key === "lvlFinal") { const l = lfCell(p); return `<td class="c-lf${l.t ? "" : " dim"}" ${p.calc ? "" : `data-lf="${esc(String(p.id ?? ""))}"`}${l.tip ? ` title="${l.tip}"` : ""}>${l.h || "—"}</td>`; }
  if (c.key === "exitWeek") {
      const e = exitWeekOf(p);
      if (!e) return `<td class="dim">—</td>`;
      const tip = e.seasons === 0 ? "En la temporada actual" : e.seasons === 1 ? "En la próxima temporada" : `En ${e.seasons} temporadas más`;
      const ao = ageOutOf(p), h = ao == null ? null : ageHue(ao);
        return `<td title="${tip}">${h == null ? e.week : `<span class="ao" style="--h:${h}">${e.week}</span>`}</td>`;
    }
    if (c.key === "ageOut") { const v = ageOutOf(p); return v == null ? `<td class="dim">—</td>` : `<td>${ageHue(v) == null ? v : `<span class="ao" style="--h:${ageHue(v)}">${v}</span>`}</td>`; }
    if (c.key === "skill") {
      const v = p.skill;
      if (!Number.isFinite(v)) return `<td class="${tdCls(c)}"><span class="dim">—</span></td>`;
      const b = p.prevSkill;
      const mark = Number.isFinite(b) && b !== v
        ? (v > b ? ` <span class="chg up" title="Subió: antes ${b}" aria-label="subió, antes ${b}">▲</span>` : ` <span class="chg down" title="Bajó: antes ${b}" aria-label="bajó, antes ${b}">▼</span>`)
        : "";
      return `<td class="${tdCls(c)}">${v}${mark}</td>`;
    }
    if (c.key === "prog") {
      return p.id == null ? `<td class="c-prog dim">—</td>`
        : `<td class="c-prog"><input type="text" maxlength="200" data-jid="${esc(String(p.id))}" value="${esc(progOf(p))}" placeholder="Escribe aquí" aria-label="Progreso de ${esc(p.name)}" autocomplete="off"></td>`;
    }
    if (c.key === "weeks") {
      if (p.weeks == null) return `<td class="dim">—</td>`;
      return p.weeks === 0 ? `<td><span class="ready" title="Terminó la academia: puede ascender al plantel">Listo</span></td>` : `<td>${p.weeks}</td>`;
    }
    const t = cellText(p, c.key);
    return `<td class="${tdCls(c)}">${t === "" ? '<span class="dim">—</span>' : esc(t)}</td>`;
}

function render() {
  savePrefs();
  renderSummary();
  const rows = state.calc ? [state.calcP] : visibleRows();
  $("#body").innerHTML = state.calc ? calcRowHtml() : rows.length ? rows.map((p, rowIdx) => {
    const tds = COLS.map(c => cellHtml(c, p, rowIdx)).join("");
    return `<tr>${tds}</tr>`;
  }).join("") : `<tr><td class="empty" colspan="${COLS.length}">${state.players.length ? "Ningún juvenil coincide con los filtros. Borra la búsqueda o desactiva «Talentosos»." : "No hay juveniles para mostrar."}</td></tr>`;

  applyColVis();
  applyFreeze();
  document.querySelectorAll("#head th").forEach(th => {
    th.setAttribute("aria-sort", th.dataset.key === state.sort.key ? (state.sort.dir === 1 ? "ascending" : "descending") : "none");
  });

  const name = (state.teamName || CONFIG.title).toUpperCase();
  $("#title").textContent = name;
  document.title = name + " · JUVENILES";
  { const c = state.calendar, parts = [];
    if (c && Number.isFinite(c.season)) parts.push("Temporada " + c.season);
    if (c && Number.isFinite(c.week)) parts.push("Semana " + c.week);
    const el = $("#season"); el.textContent = parts.join(" · "); el.hidden = !parts.length; }

  const total = state.players.length;
  const when = state.stamp ? fmtDate(state.stamp) : "";
  if (state.calc) { $("#lede").innerHTML = "<strong>Calculadora:</strong> escribe el Progreso y se calculan Talento Estimado, R2, Regresión y Recuento. Lo que escribas aquí no se guarda ni se sincroniza."; return; }
  $("#lede").innerHTML = total
    ? `${when ? esc(`Datos al ${when}${when.endsWith(".") ? "" : "."}`) : ""}${state.prevStamp ? esc(`${when ? " " : ""}Flechas ▲▼ en Nivel: cambios respecto al ${fmtDate(state.prevStamp).replace(/,.*$/, "")}.`) : ""}<span id="syncMsg">${syncText() ? " " + esc(syncText()) : ""}</span>`
    : "No hay juveniles para mostrar.";
}

let toastTimer;
function toast(msg, ms = 2000) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch {}
    ta.remove();
  }
}
async function copyTable() {
  const rows = visibleRows();
  const cols = visibleCols();
  const lines = [cols.map(c => c.label === "#" ? "N" : c.label).join("\t")];
  rows.forEach((p, i) => lines.push(cols.map(c => c.key === "n" ? i + 1 : cellText(p, c.key).replace(/\t|\n/g, " ")).join("\t")));
  await copyText(lines.join("\n"));
  const btn = $("#copy"), old = btn.textContent;
  btn.textContent = `Copiadas ${rows.length} filas`;
  setTimeout(() => { btn.textContent = old; }, 1800);
}

/* ─────────────── Modo claro y oscuro ─────────────── */
const ICON_SUN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
const ICON_MOON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;
function currentTheme() {
  return document.documentElement.dataset.theme
    || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}
function paintThemeButton() {
  const dark = currentTheme() === "dark";
  const b = $("#theme");
  const label = dark ? "Cambiar a modo claro" : "Cambiar a modo oscuro";
  b.setAttribute("aria-label", label);
  b.title = label;
  b.innerHTML = dark ? ICON_SUN : ICON_MOON;
}
function initTheme() {
  paintThemeButton();
  $("#theme").addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("cantera:theme", next); } catch {}
    paintThemeButton();
  });
}

/* ─────────────── Eventos ─────────────── */
function init() {
  initTheme();
  $("#nav").addEventListener("change", e => { location.href = e.target.value; });
  window.addEventListener("pageshow", () => { $("#nav").value = "juveniles.html"; });   // al volver atrás, el menú debe indicar esta sección
  buildHead();
  $("#head").addEventListener("click", e => {
    const th = e.target.closest("th"); if (!th) return;
    const key = th.dataset.key;
    state.sort = state.sort.key === key
      ? { key, dir: -state.sort.dir }
      : { key, dir: key === "name" || key === "n" || key === "weeks" ? 1 : -1 };
    render();
  });
  $("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
  $("#copy").addEventListener("click", copyTable);
  $("#body").addEventListener("change", ev => { const t = ev.target; if (t && t.dataset && t.dataset.chk) { setCheck(t.dataset.chk, t.value); t.dataset.v = t.value; } });
  $("#stars").addEventListener("click", () => { state.onlyStars = !state.onlyStars; $("#stars").setAttribute("aria-pressed", String(state.onlyStars)); render(); });
  $("#simplify").addEventListener("click", () => { setSimple(!state.simple); render(); });
  $("#calcBtn").addEventListener("click", () => { setCalc(!state.calc); render(); });
  $("#body").addEventListener("input", ev => {
    const t = ev.target; if (!t || !t.dataset || !t.dataset.calc || !state.calcP) return;
    const k = t.dataset.calc;
    if (k === "progText") normProgInput(t);
    if (CALC_NUM.includes(k)) { const n = t.value === "" ? null : Number(t.value); state.calcP[k] = Number.isFinite(n) ? n : null; }
    else state.calcP[k] = t.value;
    calcRefresh();
  });
  $("#body").addEventListener("input", ev => { const t = ev.target; if (t && t.dataset && t.dataset.jid) { normProgInput(t); setProg(t.dataset.jid, t.value); renderSummary(); t.closest("tr").querySelectorAll("td[data-reg]").forEach(rg => { const rc = regCol(rg.dataset.f, t.value), x = rc.t; rg.textContent = x || "—"; rg.classList.toggle("dim", !x); rg.classList.toggle("hi", !!rc.hi); }); const nm = t.closest("tr").querySelector("td[data-nm]"); if (nm) { const pl = state.players.find(q => String(q.id) === nm.dataset.nm); if (pl) nm.innerHTML = nameHtml(pl); } const lf = t.closest("tr").querySelector("td[data-lf]"); if (lf) { const pl = state.players.find(q => String(q.id) === lf.dataset.lf); if (pl) { const l = lfCell(pl); lf.innerHTML = l.h || "—"; lf.classList.toggle("dim", !l.t); lf.title = l.tip; } } const td = t.closest("tr").querySelector("td[data-cnt]"); if (td) td.innerHTML = cntHtml(countItems(t.value), td.dataset.wi === "" ? null : Number(td.dataset.wi)); } });
  $("#pwForm").addEventListener("submit", ev => {
    ev.preventDefault();
    const pw = $("#pwInput").value;
    const dlg = $("#pwDlg"), res = dlg._res; dlg._res = null;
    $("#pwInput").value = "";
    if (res) res(pw);
  });
  $("#pwDlg").addEventListener("cancel", ev => ev.preventDefault());   // no se puede cerrar sin contraseña
  $("#forgetPw").addEventListener("click", () => { forgetPw(); location.reload(); });
  loadPrefs();
  render();
  load();
}
init();
