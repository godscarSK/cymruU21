<style>
:root {
  --bg: #c6c6be;
  --panel: #ffffff;
  --ink: #1b2a41;

  --line: #cfd8d2;
  --accent: #c8352f;
  --accent-ink: #ffffff;
  --bar: #5b9a74;
  --hl: #ffe9a8;
  --inj: #d6232a;
  --call: #1a5fd0;
  --call-ink: #ffffff;
  --zebra: #f1f5f3;
  --notice-bg: #fff3d6;
  --notice-line: #d9b240;
  --error-bg: #fde8e6;
  --error-line: #c8352f;
  --head-bg: #e3e9e5;
  --focus: #1b6fd1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a22;
    --panel: #16232d;
    --ink: #e6edf1;
    --muted: #93a4b0;
    --line: #2a3b47;
    --accent: #ef6a62;
    --accent-ink: #1a0b0a;
    --bar: #4f9d73;
    --hl: #5a4a12;
    --inj: #ff6b63;
    --call: #6aaeff;
    --call-ink: #0b1a2b;
    --zebra: #1b2b36;
    --notice-bg: #3a3118;
    --notice-line: #8a7326;
    --error-bg: #3b1d1b;
    --error-line: #ef6a62;
    --head-bg: #1d2e3a;
    --focus: #6aaeff;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a22; --panel: #16232d; --ink: #e6edf1; --muted: #93a4b0; --line: #2a3b47;
  --accent: #ef6a62; --accent-ink: #1a0b0a; --bar: #4f9d73; --hl: #5a4a12; --inj: #ff6b63; --call: #6aaeff; --call-ink: #0b1a2b; --zebra: #1b2b36; --notice-bg: #3a3118;
  --notice-line: #8a7326; --error-bg: #3b1d1b; --error-line: #ef6a62; --head-bg: #1d2e3a; --focus: #6aaeff;
}


:root { --gk-bg:#fbefc2; --gk-bd:#c9a227; --def-bg:#d4efdc; --def-bd:#4f9a6c; --mid-bg:#f3d9df; --mid-bd:#8a2038; --att-bg:#d6dcec; --att-bd:#1f2d5c; }
:root[data-theme="dark"] { --gk-bg:#4a3f12; --gk-bd:#c9a227; --def-bg:#1f4130; --def-bd:#4f9d73; --mid-bg:#4a1a26; --mid-bd:#c0485f; --att-bg:#1b2447; --att-bd:#6f84d1; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --gk-bg:#4a3f12; --gk-bd:#c9a227; --def-bg:#1f4130; --def-bd:#4f9d73; --mid-bg:#4a1a26; --mid-bd:#c0485f; --att-bg:#1b2447; --att-bd:#6f84d1; } }

* { box-sizing: border-box; }
html { color-scheme: light dark; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.45;
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }


button.btn {
  font: inherit; font-weight: 600; cursor: pointer; min-height: 38px; padding: 7px 14px;
  border-radius: 4px; border: 1px solid var(--ink); background: var(--panel); color: var(--ink);
}
button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.btn:hover { filter: brightness(0.96); }
a.btn { display: inline-flex; align-items: center; text-decoration: none; font-weight: 600; min-height: 38px; padding: 7px 14px; border-radius: 4px; border: 1px solid var(--ink); background: var(--panel); color: var(--ink); }
a.btn:hover { filter: brightness(0.96); }
button.btn[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }


[hidden] { display: none !important; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
.theme {
  position: absolute; top: 14px; right: 16px; width: 42px; height: 42px; padding: 0;
  display: grid; place-items: center; border-radius: 50%; cursor: pointer;
  border: 1px solid var(--ink); background: var(--panel); color: var(--ink);
}
.theme svg { width: 22px; height: 22px; }
.theme.sumexp { top: 64px; }
.theme.sumexp svg { width: 20px; height: 20px; }
@media (max-width: 760px) { .theme.sumexp { top: 14px; right: 66px; } .brand .logo { height: 2.3rem; } header.top h1 { font-size: 2.3rem; } header.top .lede { margin-right: 56px; } }
.theme:hover { filter: brightness(0.95); }

dialog.dlg {
  width: min(420px, calc(100vw - 32px)); padding: 22px; border: 2px solid var(--ink); border-radius: 6px;
  background: var(--panel); color: var(--ink);
}
dialog.dlg::backdrop { background: rgba(10, 20, 30, .55); }
dialog.dlg h2 {
  margin: 0 0 6px; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: 2rem; line-height: 1; font-weight: 700;
}
dialog.dlg .hint { margin: 0 0 14px; color: var(--muted); font-size: .92rem; }
dialog.dlg .field { margin-bottom: 12px; }
dialog.dlg .field input { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; min-height: 40px; }
dialog.dlg .msg { min-height: 1.3em; margin: 0 0 10px; color: var(--accent); font-weight: 600; font-size: .92rem; }
dialog.dlg .actions { display: flex; justify-content: flex-end; gap: 10px; }


#toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 50;
  background: var(--ink); color: var(--panel); padding: 10px 18px; border-radius: 6px; font-weight: 600;
  box-shadow: 0 4px 16px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .2s;
}
#toast.show { opacity: 1; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 0 16px 40px; position: relative; }
header.top { padding: 22px 0 12px; }
.brand { display: flex; align-items: center; gap: clamp(10px, 2vw, 18px); padding-right: 60px; }
.brand .logo { height: clamp(2.6rem, 7vw, 4rem); width: auto; flex: none; }
h1 { margin: 0; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; font-size: clamp(2.4rem, 7vw, 4rem); line-height: .9; letter-spacing: -0.01em; }
.lede { margin: 8px 0 0; color: var(--muted); }
a.btn { display: inline-flex; align-items: center; text-decoration: none; font-weight: 600; min-height: 38px; padding: 7px 14px; border-radius: 4px; border: 1px solid var(--ink); background: var(--panel); color: var(--ink); }
a.btn:hover { filter: brightness(0.96); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 12px 0; border-top: 2px solid var(--ink); }
.toolbar label { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.toolbar select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 7px 9px; min-height: 38px; }
.toolbar .grow { flex: 1 1 auto; }
.counter { font-weight: 700; font-variant-numeric: tabular-nums; }
#syncMsg { color: var(--muted); font-size: .88rem; }
.layout { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 16px; align-items: start; }
@media (max-width: 820px) { .layout { grid-template-columns: 1fr; } .pitchcol { order: -1; } }
.pool { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; max-height: 80vh; overflow: auto; }
.pool.over, .bench.over { outline: 3px dashed var(--accent); outline-offset: -3px; }
.pool h2 { margin: 12px 0 6px; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.pool h2:first-child { margin-top: 0; }
.pool .hint { color: var(--muted); font-size: .85rem; margin: 0 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; min-height: 34px; border-radius: 5px; border: 2px solid var(--line);
  background: var(--panel); color: var(--ink); font-weight: 700; font-size: .92rem; cursor: grab; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; white-space: nowrap; touch-action: manipulation;
}
.chip:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.chip.dragging { opacity: .35; }
.chip.m-GK { background: var(--gk-bg); border-color: var(--gk-bd); }
.chip.m-DEF { background: var(--def-bg); border-color: var(--def-bd); }
.chip.m-MID { background: var(--mid-bg); border-color: var(--mid-bd); }
.chip.m-ATT { background: var(--att-bg); border-color: var(--att-bd); }
.chip .inj { display: inline-flex; align-items: center; gap: 2px; font-size: .68rem; color: var(--inj); }
.chip .inj svg { width: 11px; height: 11px; fill: var(--inj); }
.chip .red { display: inline-block; width: 8px; height: 12px; border-radius: 1.5px; background: #d6232a; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.chip .u21 { padding: 0 4px; border-radius: 3px; font-size: .58rem; background: var(--call); color: var(--call-ink); }
.ghost { position: fixed; z-index: 100; pointer-events: none; transform: translate(-50%, -60%); box-shadow: 0 6px 18px rgba(0,0,0,.35); cursor: grabbing; }
.pitchcol { min-width: 0; }
.pitch {
  position: relative; width: 100%; max-width: max(320px, min(520px, calc((100vh - 60px) / 1.4))); margin: 0 auto; aspect-ratio: 5 / 7; border: 3px solid #e8f3ea; border-radius: 6px; color: #fff;
  background: repeating-linear-gradient(0deg, #2f7a4d 0 8.33%, #2a7046 8.33% 16.66%);
}
.pitch::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px solid rgba(255,255,255,.5); pointer-events: none; }
.pitch::after { content: ""; position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.5); border-radius: 50%; pointer-events: none; }
.marks { position: absolute; inset: 0; pointer-events: none; }
.marks::before, .marks::after { content: ""; position: absolute; left: 24%; width: 52%; height: 15%; border: 2px solid rgba(255,255,255,.5); }
.marks::before { top: 0; border-top: 0; }
.marks::after { bottom: 0; border-bottom: 0; }
.slot {
  position: absolute; transform: translate(-50%, -50%); z-index: 1; width: min(5.4rem, var(--w, 20%)); min-height: 44px; display: flex; align-items: center; justify-content: center;
  border-radius: 6px; border: 2px dashed rgba(255,255,255,.55); color: rgba(255,255,255,.8); font-size: .72rem; font-weight: 700; letter-spacing: .06em; padding: 3px;
  cursor: grab; touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.slot.dragging { opacity: .35; }
.slot .chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.slot.has { border: 0; padding: 0; width: auto; max-width: max(var(--w, 20%), 4.6rem); cursor: default; }
.slot.over { background: rgba(255,255,255,.25); border-color: #fff; }
.slot.mismatch .chip { box-shadow: 0 0 0 2px #f5c400; }
.chip .outb + .outb { margin-left: -2px; }
.chip .outb { font-size: .66rem; font-weight: 700; padding: 0 4px; border-radius: 3px; background: #d6232a; color: #fff; white-space: nowrap; }
.bench { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
.bench h2 { margin: 0 0 6px; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.bench .none { color: var(--muted); font-size: .88rem; }
dialog.sk { width: min(440px, calc(100vw - 32px)); padding: 18px; border: 2px solid var(--ink); border-radius: 6px; background: var(--panel); color: var(--ink); }
dialog.sk::backdrop { background: rgba(10,20,30,.55); }
dialog.sk h2 { margin: 0 0 2px; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: 2rem; line-height: 1; }
dialog.sk h2 a { color: inherit; text-decoration-color: var(--line); text-underline-offset: 4px; }
dialog.sk .meta { color: var(--muted); font-size: .92rem; margin: 4px 0 10px; }
dialog.sk .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
dialog.sk .tags span { font-size: .75rem; font-weight: 700; padding: 2px 7px; border-radius: 3px; border: 1px solid var(--line); }
.skills { display: grid; grid-template-columns: auto 2rem 1fr; gap: 6px 10px; align-items: center; margin: 8px 0 14px; }
.skills .n { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.skills .b { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.skills .b i { display: block; height: 100%; background: var(--bar); }
.skills .dim { color: var(--muted); }
dialog.sk .acts { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 3px; font-size: .875rem; color: var(--muted); }
@media (max-width: 520px) {
  .slot .chip { padding: 4px 5px; font-size: .74rem; gap: 3px; }
}

.sub { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; width: 100%; }
.sub label { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); }
.sub input, .sub select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; min-height: 34px; }
.sub input { width: 4.4rem; text-align: center; }
.sub select { max-width: 11rem; }
.bench .chips { flex-direction: column; flex-wrap: nowrap; }
.sidecol { min-width: 0; }
.sidecol .bench { margin-top: 12px; }
@media (max-width: 820px) { .sidecol { order: 0; } }
button.btn:disabled { opacity: .45; cursor: not-allowed; }
.pitch.over { outline: 3px dashed rgba(255,255,255,.7); outline-offset: -6px; }
.sub { position: relative; }
.sub.ins-before::before, .sub.ins-after::after { content: ""; position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px; background: var(--accent); }
.sub.ins-before::before { top: -5px; } .sub.ins-after::after { bottom: -5px; }
.sub .mv { display: flex; flex-direction: column; gap: 2px; }
.sub .mv button { font: inherit; font-size: .75rem; line-height: 1; width: 26px; height: 20px; padding: 0; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); color: var(--ink); cursor: pointer; }
.sub .mv button:disabled { opacity: .35; cursor: default; }

</style>

<body>
<div class="wrap">

<script>
"use strict";
const CONFIG = {
  encData: "data/players.enc.json",
  staticData: "data/players.json",
  estUrl: (window.CANTERA_CONFIG && window.CANTERA_CONFIG.estUrl) || "",
  timeoutMs: 15000
};
const PW_KEY = "cantera:pw", EST_KEY = "cantera:est2", LINEUP_KEY = "cantera:lineup", LINEUP_ID = "L1";
const EST_OPTS = ["GK", "DEF", "MID", "ATT"];
const LINES = ["ATT", "MID", "DEF", "GK"];            // de arriba (ataque) hacia abajo (portero)
const FORMS = ["3-3-4", "3-4-3", "3-5-2", "4-2-4", "4-3-3", "4-4-2", "4-5-1", "5-2-3", "5-3-2", "5-4-1"];
const CAP = { GK: 1, DEF: 5, MID: 5, ATT: 4 };         // largo máximo guardado de cada línea
const MAX_SKILL = 17;
const SK_LABELS = [["stamina", "Condición"], ["pace", "Rapidez"], ["technique", "Técnica"], ["passing", "Pases"],
  ["keeper", "Portería"], ["defender", "Defensa"], ["playmaker", "Creación"], ["striker", "Anotación"]];

const SKILL_KEYS = ["stamina", "pace", "technique", "passing", "keeper", "defender", "playmaker", "striker"];

const SKILL_ALIASES = {
  stamina:   ["stamina", "stam", "res", "resistencia"],
  pace:      ["pace", "rap", "rapidez"],
  technique: ["technique", "tech", "tec", "téc", "tecnica", "técnica"],
  passing:   ["passing", "pass", "pas", "pase"],
  keeper:    ["keeper", "goalkeeping", "gk", "por", "portero"],
  defender:  ["defender", "defending", "def", "defensa"],
  playmaker: ["playmaker", "playmaking", "pm", "cre", "creacion", "creación"],
  striker:   ["striker", "scoring", "str", "ano", "anotacion", "anotación"]
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => {
  if (typeof v === "number" && Number.isFinite(v)) return v;
  if (typeof v === "string" && v.trim() !== "" && Number.isFinite(Number(v))) return Number(v);
  if (v && typeof v === "object") {
    for (const k of ["value", "level", "current", "now", "skill", "points"]) {
      const x = v[k]; if (typeof x === "number" && Number.isFinite(x)) return x;
    }
  }
  return null;
};
function pickSkills(apiSkills, sheetSkills) {
  const lower = {};
  for (const [k, v] of Object.entries(apiSkills || {})) lower[k.toLowerCase()] = v;
  const sk = {};
  for (const key of SKILL_KEYS) {
    let v = null;
    for (const a of SKILL_ALIASES[key]) { if (a in lower) { v = num(lower[a]); if (v !== null) break; } }
    if (v === null && sheetSkills && key in sheetSkills) v = sheetSkills[key];
    sk[key] = v;
  }
  sk.form = num(apiSkills?.form);
  return sk;
}
function findSkillsSource(info) {
  const known = new Set(Object.values(SKILL_ALIASES).flat());
  const score = o => (o && typeof o === "object" && !Array.isArray(o))
    ? Object.keys(o).filter(k => known.has(k.toLowerCase())).length : 0;
  let best = info.skills || {}, bestScore = score(best);
  const queue = [info];
  for (let guard = 0; queue.length && guard < 300; guard++) {
    const o = queue.shift();
    for (const v of Object.values(o)) {
      if (v && typeof v === "object" && !Array.isArray(v)) {
        const sc = score(v);
        if (sc > bestScore) { best = v; bestScore = sc; }
        queue.push(v);
      }
    }
  }
  return bestScore >= 3 ? best : (info.skills || {});
}

function normalize(row, api) {
  const p = {
    n: row.n, name: row.name, pid: row.pid,

  drag.ghost.style.left = x + "px"; drag.ghost.style.top = y + "px";
  clearOver();
  drag.tgt = targetAt(x, y);
  const t = drag.tgt;
  if (t && !(t.type === "bench" && t.anchor === drag.pid)) {
    if (t.type === "bench" && t.anchor) t.el.classList.add(t.after ? "ins-after" : "ins-before"); else t.el.classList.add("over");
  }
  if (y < 70) window.scrollBy(0, -12); else if (y > innerHeight - 70) window.scrollBy(0, 12);   // desplaza la página cerca de los bordes
}
function dragEnd(cancel) {
  if (!drag) return;
  const d = drag; drag = null;
  clearOver();
  if (d.ghost) d.ghost.remove();
  d.el.classList.remove("dragging");
  if (!d.active) return;
  suppressClick = Date.now() + 150;
  const t = d.tgt;
  if (cancel || !t) return;
  const pr = $("#pitch").getBoundingClientRect();
  const px = (d.lx - pr.left) / pr.width * 100, py = (d.ly - pr.top) / pr.height * 100;
  if (!d.pid) {                                      // espacio vacío: solo se traslada dentro de la cancha
    if (t.type === "pitch" || t.type === "slot") { setPos(d.line, d.i, px, py); changed(); }
    return;
  }
  const src = locate(d.pid), own = t.type === "slot" && src && src.type === "slot" && src.line === t.line && src.i === t.i;
  if (t.type === "pitch" || own) placeFree(d.pid, px, py);
  else place(d.pid, t);
}
function initDrag() {
  document.addEventListener("pointerdown", e => {
    if (e.pointerType === "touch" || e.button !== 0) return;
    const el = grabbable(e.target); if (!el) return;
    e.preventDefault();                       // evita seleccionar texto al arrastrar
    dragBegin(el, e.clientX, e.clientY);
  });
  document.addEventListener("pointermove", e => { if (e.pointerType !== "touch") dragMove(e.clientX, e.clientY); });
  document.addEventListener("pointerup", e => { if (e.pointerType !== "touch") dragEnd(false); });
  document.addEventListener("pointercancel", () => dragEnd(true));
  // Táctil: se arrastra tras mantener pulsado un instante (así la página se puede desplazar normalmente).
  let timer = null;
  document.addEventListener("touchstart", e => {
    const el = grabbable(e.target); if (!el || e.touches.length !== 1) return;
    const t = e.touches[0];
    dragBegin(el, t.clientX, t.clientY);
    clearTimeout(timer);
    timer = setTimeout(() => { if (drag && !drag.active) { dragActivate(); if (navigator.vibrate) navigator.vibrate(15); dragMove(drag.x0, drag.y0 - 0); } }, 250);
  }, { passive: true });
  document.addEventListener("touchmove", e => {
    if (!drag) return;
    const t = e.touches[0];
    if (!drag.active) {
      if (Math.hypot(t.clientX - drag.x0, t.clientY - drag.y0) > 8) { clearTimeout(timer); drag = null; }   // era un desplazamiento
      return;
    }
    e.preventDefault();
    dragMove(t.clientX, t.clientY);
  }, { passive: false });
  const tEnd = cancel => () => { clearTimeout(timer); dragEnd(cancel); };
  document.addEventListener("touchend", tEnd(false));
  document.addEventListener("touchcancel", tEnd(true));
  document.addEventListener("contextmenu", e => { if (e.target.closest(".chip")) e.preventDefault(); });
  document.addEventListener("dragstart", e => { if (e.target.closest(".chip")) e.preventDefault(); });
  document.addEventListener("click", e => {
    const chip = e.target.closest(".chip"); if (!chip || chip.classList.contains("ghost")) return;
    if (Date.now() < suppressClick) return;
    openSkills(chip.dataset.pid);
  });
  document.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("chip")) { e.preventDefault(); openSkills(e.target.dataset.pid); }
  });
}

/* ─────────────── Ficha de skills ─────────────── */
let skPid = "";
function openSkills(pid) {
  const p = byPid.get(pid); if (!p) return;
  skPid = pid;
  const m = markOf(pid), placed = placedSet().has(pid);
  $("#skName").innerHTML = `<a href="https://sokker.org/player/PID/${encodeURIComponent(pid)}" target="_blank" rel="noopener">${esc(p.name)}</a>`;
  const bits = [];
  if (p.age != null) bits.push(`${p.age} años`);
  if (p.value != null) bits.push(`${nf.format(p.value)} ${esc(p.currency)}`.trim());
  if (p.team) bits.push(esc(p.team));
  $("#skMeta").innerHTML = bits.join(" · ") || "—";
  $("#skTags").innerHTML = `<span>Pos. ${m}</span>` + (p.injury ? `<span style="color:var(--inj)">Lesionado ${p.injury} d</span>` : "") +
    (p.red ? `<span style="color:var(--inj)">Tarjeta roja en la selección</span>` : "");
  let rows = "";
  const sk = p.skills || {};
  if (Number.isFinite(p.form)) rows += `<span>Forma</span><span class="n">${p.form}</span><span></span>`;   // sin barra: su escala no es la de las skills
  for (const [k, lab] of SK_LABELS) {
    const v = sk[k];
    rows += Number.isFinite(v)
      ? `<span>${lab}</span><span class="n">${v}</span><span class="b"><i style="width:${Math.min(100, v / MAX_SKILL * 100)}%"></i></span>`
      : `<span class="dim">${lab}</span><span class="n dim">—</span><span class="b"></span>`;
  }
  $("#skRows").innerHTML = rows;
  $("#skToggle").textContent = placed ? "Quitar de la alineación" : "Agregar a la alineación";
  if (!$("#skDlg").open) $("#skDlg").showModal();
}

/* ─────────────── Sincronización entre dispositivos ─────────────── */
const sync = { key: null, token: "", busy: false, jsonp: false, state: "local", detail: "", fetchErr: "" };
const te = new TextEncoder();
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
const b64u = a => btoa(String.fromCharCode(...a)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64u = t => Uint8Array.from(atob(t.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
async function estInit(pw) {
  const p = String(pw).normalize("NFC");
  const km = await crypto.subtle.importKey("raw", te.encode(p), "PBKDF2", false, ["deriveKey"]);
  sync.key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: te.encode("cantera-est-v1"), iterations: 250000, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  sync.token = hex(await crypto.subtle.digest("SHA-256", te.encode("cantera-est-token|" + p)));
}
async function encV(v) {
  if (!v) return "";
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, sync.key, te.encode(v)));
  const o = new Uint8Array(12 + ct.length); o.set(iv); o.set(ct, 12);
  return b64u(o);
}
async function decV(s) {
  if (!s) return "";
  const o = unb64u(String(s));
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: o.slice(0, 12) }, sync.key, o.slice(12)));
}
function jsonp(u) {
  return new Promise((res, rej) => {
    const cb = "__al_" + Math.random().toString(36).slice(2);
    const el = document.createElement("script");
    let tm;
    const done = () => { delete window[cb]; el.remove(); clearTimeout(tm); };
    tm = setTimeout(() => { done(); const e = new Error("sin respuesta"); e.name = "JsonpTimeout"; rej(e); }, CONFIG.timeoutMs);
    window[cb] = d => { done(); res(d); };
    el.onerror = () => { done(); const e = new Error("no se pudo cargar"); e.net = true; rej(e); };
    u.searchParams.set("callback", cb);
    el.src = u.toString();
    document.head.appendChild(el);
  });
}
async function estCall(params) {
  const u = new URL(CONFIG.estUrl);
  for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
  u.searchParams.set("_", Date.now());
  let j = null;
  if (!sync.jsonp) {
    let r = null;
    try { r = await fetchWithTimeout(u.toString()); }
    catch (err) { if (err.name === "AbortError") throw err; sync.fetchErr = String(err.message || err); }
    if (r) { if (!r.ok) throw new Error("HTTP " + r.status); j = await r.json(); } else sync.jsonp = true;
  }
  if (!j) j = await jsonp(u);
  if (!j.ok) throw new Error(j.error || "error");
  return j;
}
function explain(err) {
  const m = String(err && err.message || err);
  if (/pid inv|valor inv/i.test(m)) return "el servicio tiene una versión anterior de est-sync.gs. Pega la versión nueva en Apps Script y crea una «Nueva versión» de la implementación (ver README).";
  if (/token/i.test(m)) return "el servicio rechazó la clave (ver README).";
  if (err && err.name === "AbortError") return "el servicio tardó demasiado en responder.";
  if (err && (err.net || err.name === "JsonpTimeout")) return "no se pudo conectar con el servicio.";
  return "el servicio respondió: " + m;
}
function setSync(state, detail = "") {
  sync.state = state; sync.detail = detail;
  const T = { local: "", ok: "Alineación sincronizada.", pending: "Sincronizando…", offline: "Pendiente de sincronizar.", token: "No se pudo sincronizar." };
  $("#syncMsg").textContent = (T[state] || "") + (detail ? " Motivo: " + detail : "");
}
let pushTimer = null;
function schedulePush() { clearTimeout(pushTimer); pushTimer = setTimeout(pushAll, 500); }
async function pushAll() {
  if (!CONFIG.estUrl || !sync.key || sync.busy) return;
  const todo = Object.values(lib.items).filter(x => x.dirty);
  if (!todo.length) return;
  sync.busy = true; setSync("pending");
  try {
    for (const it of todo) {
      const snap = it.t;
      const v = it.del ? "" : await encV(JSON.stringify({ n: it.name, f: it.f, l: it.l, b: it.b, s: it.s, p: it.p }));   // valor vacío = alineación eliminada
      await estCall({ action: "set", pid: it.id, v, t: snap, token: sync.token });
      if (it.t === snap) { it.dirty = false; saveLocal(); }
    }
    sync.busy = false;
    if (Object.values(lib.items).some(x => x.dirty)) return pushAll();
    setSync("ok");
  } catch (err) { sync.busy = false; setSync(/token/i.test(err.message) ? "token" : "offline", explain(err)); }
}
async function pull() {
  if (!CONFIG.estUrl || !sync.key) return;
  try {
    const j = await estCall({ action: "list" });
    const remoteL = {};
    let estChanged = false;
    for (const it of j.items || []) {
      const pid = String(it.pid), t = Number(it.t) || 0;
      let v; try { v = await decV(it.v); } catch { continue; }
      if (/^\d+$/.test(pid)) { const loc = estMap[pid]; if (!loc || t > loc.t) { estMap[pid] = { v: EST_OPTS.includes(v) ? v : "", t }; estChanged = true; } }
      else if (LIB_ID.test(pid)) remoteL[pid] = { t, v };
    }
    let lineChanged = false;
    for (const [id, r] of Object.entries(remoteL)) {
      const loc = lib.items[id];
      if (loc && loc.t >= r.t) { if (loc.t > r.t) loc.dirty = true; continue; }
      if (r.v === "") { const o = newItem(id, loc ? loc.name : "Alineación"); o.t = r.t; o.del = true; lib.items[id] = o; lineChanged = true; continue; }
      try { const d = JSON.parse(r.v); const o = newItem(id, d.n, d); o.t = r.t; lib.items[id] = o; lineChanged = true; } catch {}
    }
    for (const it of Object.values(lib.items)) if (!remoteL[it.id] && it.t > 0) it.dirty = true;
    // la alineación inicial vacía de un dispositivo nuevo no debe quedar si el servicio ya tiene otras
    const dflt = lib.items[LINEUP_ID];
    if (dflt && dflt.t === 0 && !dflt.dirty && !remoteL[LINEUP_ID] && Object.values(remoteL).some(r => r.v !== "")) { delete lib.items[LINEUP_ID]; lineChanged = true; }
    useActive(); saveLocal();
    if (estChanged || lineChanged) render();
    if (Object.values(lib.items).some(x => x.dirty)) await pushAll(); else setSync("ok");
  } catch (err) { setSync("offline", explain(err)); }
}

/* ─────────────── Utilidades de la página ─────────────── */
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
function setStatus(t) { $("#lede").textContent = t; }
const ICON_SUN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
const ICON_MOON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;

function currentTheme() {
  return document.documentElement.dataset.theme
    || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}
function paintThemeButton() {
  const dark = currentTheme() === "dark";
  const b = $("#theme");
  const label = dark ? "Cambiar a modo claro" : "Cambiar a modo oscuro";
  b.setAttribute("aria-label", label);
  b.title = label;
  b.innerHTML = dark ? ICON_SUN : ICON_MOON;   // el icono muestra el modo al que se cambia
}
function initTheme() {
  paintThemeButton();
  $("#theme").addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("cantera:theme", next); } catch {}
    paintThemeButton();
  });
}



async function init() {
  initTheme();
  initDrag();
  $("#formSel").innerHTML = FORMS.map(f => `<option>${f}</option>`).join("");
  $("#formSel").addEventListener("change", e => { lineup.f = FORMS.includes(e.target.value) ? e.target.value : lineup.f; changed(); });
  // Minuto y reemplazo de cada suplente (no se redibuja al escribir para no perder el cursor)
  let subTimer = null;
  const setSub = (pid, key, val) => {
    if (!lineup.b.includes(pid)) return;
    lineup.s[pid] = { m: "", o: "", ...(lineup.s[pid] || {}), [key]: val };
    lineup.t = Date.now(); lineup.dirty = true; saveLocal(); schedulePush();
  };
  $("#bench").addEventListener("input", e => {
    const i = e.target.closest(".mn input"); if (!i) return;
    setSub(i.dataset.pid, "m", i.value.trim().slice(0, 8));
    clearTimeout(subTimer); subTimer = setTimeout(render, 900);       // refleja el minuto en la cancha cuando dejas de escribir
  });
  $("#bench").addEventListener("click", e => {
    const b = e.target.closest("button[data-mv]"); if (!b || b.disabled) return;
    moveSub(b.dataset.pid, +b.dataset.mv);
  });
  $("#posReset").addEventListener("click", () => { lineup.p = {}; changed(); toast("Posiciones restablecidas"); });
  $("#bench").addEventListener("change", e => {
    const sel = e.target.closest(".po select"); if (!sel) return;
    setSub(sel.dataset.pid, "o", sel.value); render();
  });
  $("#clear").addEventListener("click", () => {
    if (!confirm("¿Vaciar la alineación (cancha y suplentes)?")) return;
    const keep = { id: lineup.id, name: lineup.name, f: lineup.f };
    Object.assign(lineup, emptyLineup(), { f: keep.f, p: lineup.p, id: keep.id, name: keep.name, dirty: true, del: false }); changed();
  });
  const askName = (msg, def) => { const n = prompt(msg, def); return n === null || !n.trim() ? null : cleanName(n); };
  const add = (name, o) => {
    const id = nextId(); if (!id) { toast("Se alcanzó el máximo de alineaciones"); return; }
    const it = newItem(id, name, o); it.t = Date.now(); it.dirty = true;
    lib.items[id] = it; lib.active = id; useActive(); saveLocal(); render(); schedulePush();
  };
  $("#lineSel").addEventListener("change", e => {
    const it = lib.items[e.target.value]; if (!it || it.del) return;
    lib.active = it.id; useActive(); saveLocal(); render();
  });
  $("#lineNew").addEventListener("click", () => { const n = askName("Nombre de la nueva alineación:", `Alineación ${visibleIds().length + 1}`); if (n) add(n, { f: lineup.f }); });
  $("#lineDup").addEventListener("click", () => {
    const n = askName("Nombre de la copia:", `${lineup.name} (copia)`);
    if (n) add(n, JSON.parse(JSON.stringify({ f: lineup.f, l: lineup.l, b: lineup.b, s: lineup.s, p: lineup.p })));
  });
  $("#lineRen").addEventListener("click", () => { const n = askName("Nuevo nombre:", lineup.name); if (n) { lineup.name = n; changed(); } });
  $("#lineDel").addEventListener("click", () => {
    if (visibleIds().length < 2) { toast("Debe quedar al menos una alineación"); return; }
    if (!confirm(`¿Eliminar la alineación «${lineup.name}»?`)) return;
    lineup.del = true; lineup.t = Date.now(); lineup.dirty = true;
    useActive(); saveLocal(); render(); schedulePush();
  });
  $("#skToggle").addEventListener("click", () => {
    const pid = skPid; $("#skDlg").close();
    if (placedSet().has(pid)) { removeAll(pid); changed(); toast("Quitado de la alineación"); } else autoAdd(pid);
  });
  $("#skClose").addEventListener("click", () => $("#skDlg").close());
  $("#skDlg").addEventListener("click", e => { if (e.target === $("#skDlg")) $("#skDlg").close(); });
  $("#pwForm").addEventListener("submit", ev => {
    ev.preventDefault();
    const dlg = $("#pwDlg"), res = dlg._res; dlg._res = null;
    const pw = $("#pwInput").value; $("#pwInput").value = "";
    if (res) res(pw);
  });
  $("#pwDlg").addEventListener("cancel", ev => ev.preventDefault());
  setStatus("Cargando jugadores…");
  const got = await loadData();
  if (!got) { setStatus("No se encontró el archivo de datos (data/players.enc.json). Ejecuta fetch-players.mjs y súbelo a GitHub."); return; }
  const { data, pw } = got;
  players = data.rows.map(r => normalize(r, data.api?.[r.pid]));
  players.forEach(p => byPid.set(p.pid, p));
  render();
  if (pw && CONFIG.estUrl) {
    try { await estInit(pw); } catch { return; }
    setSync("pending");
    await pull();
    document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
    window.addEventListener("online", pull);
  }
}
init();
